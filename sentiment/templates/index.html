<!DOCTYPE html>
<html>
<head>
<title>Sentiment Analyzer</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
background: linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
}

.container{
background: rgba(255,255,255,0.1);
backdrop-filter: blur(12px);
padding:40px;
width:420px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;
color:white;
}

h2{
margin-bottom:20px;
font-weight:600;
}

textarea{
width:100%;
height:100px;
border:none;
outline:none;
padding:12px;
border-radius:10px;
resize:none;
font-size:14px;
}

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:25px;
background: linear-gradient(135deg,#00c6ff,#0072ff);
color:white;
font-size:15px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

.result-box{
margin-top:25px;
padding:15px;
border-radius:10px;
font-size:18px;
font-weight:500;
}

/* COLORS BASED ON RESULT */
.positive{
background:#00c853;
}

.negative{
background:#d50000;
}

.neutral{
background:#ffab00;
}

</style>
</head>

<body>

<div class="container">
<h2>Sentiment Analyzer</h2>

<form method="post">
{% csrf_token %}
<textarea name="text" placeholder="Enter your sentence..."></textarea>
<br>
<button type="submit">Analyze</button>
</form>

{% if result %}
<div class="result-box 
{% if result == 'positive' %}positive
{% elif result == 'negative' %}negative
{% else %}neutral
{% endif %}">

{{ result|title }}

</div>
{% endif %}

</div>

</body>
</html>
